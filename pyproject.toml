[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bilterm-visual-regression"
version = "0.1.0"
description = "Semantic visual regression testing and TUI element localization using TypeSafe Jev System One"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Bill", email = "bill@example.com"}
]
dependencies = [
    "httpx>=0.25.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
bilterm-vr = "bilterm_vr.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
